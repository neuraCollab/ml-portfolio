name: Deploy to GitHub Pages

# Builds the frontend (frontend/) as a static site and publishes it to
# GitHub Pages. The live "Live Backend Demo" buttons on each page need the
# FastAPI backend (backend/) running somewhere reachable, which GitHub Pages
# cannot host (it only serves static files) -- on the deployed site those
# calls fail gracefully with "Could not reach the backend API" instead of
# crashing. The static "Results" sections at the bottom of the Autopilot and
# ECG pages are pre-generated real pipeline output (see
# backend/scripts/generate_static_results.py) and work with no backend at all.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight run finish rather
# than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build (GitHub Pages base path)
        working-directory: frontend
        run: npx tsc && npx vite build --mode gh-pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
