services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000
      - AUTOTOPIC_DATA_URL=${AUTOTOPIC_DATA_URL:-data/raw/labeled_requests.parquet}
      - CASSANDRA_HOST=host.docker.internal
      - CASSANDRA_PORT=30942
      - CASSANDRA_GRPC_COORDINATOR_URL=http://host.docker.internal:30080
      - CASSANDRA_GRPC_DATASET_PATH=${CASSANDRA_GRPC_DATASET_PATH:-AutoTopic/data/raw/labeled_requests.parquet}
      - CASSANDRA_GRPC_SAMPLE_SIZE=${CASSANDRA_GRPC_SAMPLE_SIZE:-40000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
        - VITE_AUTOTOPIC_PRESENTATION_URL=${VITE_AUTOTOPIC_PRESENTATION_URL:-<REPLACE_WITH_GOOGLE_DRIVE_URL>}
    ports:
      - "3000:3000"
    depends_on:
      - backend
