# UNVERIFIED -> verified during this plan's Task 8.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra-grpc-ml-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra-grpc-ml-worker
  template:
    metadata:
      labels:
        app: cassandra-grpc-ml-worker
    spec:
      containers:
        - name: grpc-worker
          image: cassandra-grpc-ml-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50061
          env:
            - name: CASSANDRA_HOST
              value: "cassandra-grpc-ml-cassandra"
            - name: MODEL_PERSISTENCE
              value: "cassandra"
          resources:
            requests:
              memory: "200Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
