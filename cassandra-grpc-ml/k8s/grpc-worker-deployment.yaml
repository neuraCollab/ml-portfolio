# UNVERIFIED -> verified during this plan's Task 8.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra-grpc-ml-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra-grpc-ml-worker
  template:
    metadata:
      labels:
        app: cassandra-grpc-ml-worker
    spec:
      containers:
        - name: grpc-worker
          image: cassandra-grpc-ml-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50061
          env:
            - name: CASSANDRA_HOST
              value: "cassandra-grpc-ml-cassandra"
            - name: MODEL_PERSISTENCE
              value: "cassandra"
          resources:
            requests:
              memory: "200Mi"
              cpu: "250m"
            limits:
              # 1Gi was not enough: a real training run at this project's
              # actual UI default (sampleSize=40000) OOM-killed the pod
              # (exit 137) while fitting a TfidfVectorizer(max_features=50000,
              # ngram_range=(1,2)) + 50-class LogisticRegression -- confirmed
              # live during the k8s plan's final review. Requests stay low
              # since only whichever pod is actively handling a /train RPC
              # needs the headroom; idle/serving replicas use far less.
              memory: "2Gi"
              cpu: "1000m"
