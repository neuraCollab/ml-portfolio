# UNVERIFIED -> verified during this plan's Task 8.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra-grpc-ml-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra-grpc-ml-worker
  template:
    metadata:
      labels:
        app: cassandra-grpc-ml-worker
    spec:
      containers:
        - name: grpc-worker
          image: cassandra-grpc-ml-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50061
          env:
            - name: CASSANDRA_HOST
              value: "cassandra-grpc-ml-cassandra"
            - name: MODEL_PERSISTENCE
              value: "shared"
            - name: MINIO_ENDPOINT
              value: "cassandra-grpc-ml-minio:9000"
            - name: MINIO_ACCESS_KEY
              value: "minioadmin"
            - name: MINIO_SECRET_KEY
              value: "minioadmin"
            - name: MINIO_BUCKET
              value: "cassandra-grpc-ml-models"
          resources:
            requests:
              memory: "200Mi"
              cpu: "250m"
            limits:
              # 1Gi was not enough: a real training run at this project's
              # actual UI default (sampleSize=40000) OOM-killed the pod
              # (exit 137) while fitting a TfidfVectorizer(max_features=50000,
              # ngram_range=(1,2)) + 50-class LogisticRegression -- confirmed
              # live during the k8s plan's final review. Requests stay low
              # since only whichever pod is actively handling a /train RPC
              # needs the headroom; idle/serving replicas use far less.
              memory: "2Gi"
              # A 1-core limit made ml_core.py's real OneVsRestClassifier(...,
              # n_jobs=-1) parallelism (fitting each class's binary classifier
              # on its own core) a moot point inside the cluster -- the pod
              # was never able to use a second core regardless of what the
              # training code requested. 4 cores gives real, visible
              # multi-core speedup for a single training run without
              # over-committing this host's 12 CPUs across up to 5 replicas.
              cpu: "4000m"
