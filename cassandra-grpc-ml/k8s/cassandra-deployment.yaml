# Verified during this plan's Task 5/8.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra-grpc-ml-cassandra
  labels:
    app: cassandra-grpc-ml-cassandra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra-grpc-ml-cassandra
  template:
    metadata:
      labels:
        app: cassandra-grpc-ml-cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:5
          ports:
            - containerPort: 9042
          env:
            - name: MAX_HEAP_SIZE
              value: "768M"
            - name: HEAP_NEWSIZE
              value: "200M"
            - name: CASSANDRA_CLUSTER_NAME
              value: PortfolioCassandra
          resources:
            requests:
              memory: "1.5Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
      volumes:
        - name: cassandra-data
          persistentVolumeClaim:
            claimName: cassandra-grpc-ml-cassandra-pvc
